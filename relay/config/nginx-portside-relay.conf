# ==============================================================================
# PortSide Primary Multiplexed Relay Nginx Ingress Configuration
# Server IP: 37.221.67.247
# ==============================================================================

# Upstream to local portsided-relay HTTP ingress
upstream portside_relay_upstream {
    server 127.0.0.1:7080;
    keepalive 64;
}

# 1. Wildcard HTTP ingress for *.portside.lol
server {
    listen 80;
    server_name *.portside.lol;

    # Allow Let's Encrypt / Cloudflare ACME challenges if needed
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://portside_relay_upstream;
        proxy_http_version 1.1;

        # WebSocket & chunked transfer stream headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward real client connection details
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for real-time dev streaming (SSE, HMR, Next.js live reload)
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 100M;
    }
}

# 2. Wildcard HTTPS ingress for *.portside.lol (if SSL terminated at Nginx)
server {
    listen 443 ssl http2;
    server_name *.portside.lol;

    ssl_certificate /etc/letsencrypt/live/mail.portside.lol/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.portside.lol/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://portside_relay_upstream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 100M;
    }
}
