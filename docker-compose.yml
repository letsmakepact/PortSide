name: portside

services:
  postgres:
    image: postgres:16-alpine
    container_name: portside-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portside_db
    ports:
      - "5432:5432"
    volumes:
      - portside_pgdata:/var/lib/postgresql/data

volumes:
  portside_pgdata: